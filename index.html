<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ari's CREATOR PORTFOLIO</title>
  <style>
    :root {
      /* ★ 背景画像のファイル名（GitHubに上げた画像名） */
      --bg-image: url('bg.png'); 
      /* ★ ヘッダー専用画像のファイル名（1200x300px = 4:1 推奨） */
      --header-image: url('header.png');

      /* カラー設定 */
      --text-main: #0f172a;
      --text-sub: #475569;
      --accent: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--text-main);
      
      height: 100vh;
      overflow: hidden; /* 画面全体のスクロールを消し、中央の小窓だけ動かす */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    /* ★ 中央の小窓ウィンドウ ★ */
    .container { 
      width: 90%;                      
      max-width: 760px;               
      height: 85vh;                   
      margin: 0 auto; 
      padding: 0 24px 24px 24px;
      
      background-color: rgba(255, 255, 255, 0.75); 
      backdrop-filter: blur(12px);                 
      border-radius: 16px;                         
      border: 1px solid rgba(255, 255, 255, 0.5);   
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);  
      
      overflow-y: auto;                            /* 中身だけスクロール */
      display: flex;
      flex-direction: column;
    }

    /* ★ ヘッダー＋ボタン全体を最上部に完全固定（PC時は白地） ★ */
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(255, 255, 255, 0.95); /* PC時は白地 */
      backdrop-filter: blur(8px);
      margin: 0 -24px 20px -24px;       /* ウィンドウの左右端まで背景色を伸ばす */
      padding: 20px 24px 12px 24px;
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
      border-radius: 16px 16px 0 0;     /* ウィンドウの上部角丸に合わせる */
    }

    header { 
      text-align: center; 
      margin-bottom: 12px;
    }
    header h1 { 
      font-size: 1.5rem;               
      font-weight: 700;
      letter-spacing: 2.5px; 
      margin-bottom: 4px; 
      color: var(--text-main);
    }
    header p { 
      color: var(--text-sub); 
      font-size: 0.78rem; 
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* フィルターボタン & 並べ替え */
    .filter-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .filter-btn {
      background-color: #ffffff;
      color: var(--text-sub);
      border: 1px solid #cbd5e1;
      padding: 6px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .filter-btn:hover {
      color: var(--text-main);
      border-color: #94a3b8;
    }
    .filter-btn.active {
      background-color: var(--text-main);
      color: #ffffff;
      border-color: var(--text-main);
    }

    /* 並べ替えセレクトボックス */
    .sort-select {
      background-color: #ffffff;
      color: var(--text-sub);
      border: 1px solid #cbd5e1;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }
    .sort-select:hover {
      border-color: #94a3b8;
      color: var(--text-main);
    }

    /* 作品グリッド（動画カードの配列） */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 500px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 700px) { .grid { grid-template-columns: repeat(3, 1fr); } }

    /* 動画カード */
    .card {
      background-color: #ffffff;
      border-radius: 8px;
      border: 1px solid rgba(226, 232, 240, 0.8);
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }
    .thumbnail-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background-color: #000;
    }
    .thumbnail-wrapper img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .play-icon {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 44px; height: 44px;
      background: rgba(0,0,0,0.7);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .play-icon::after {
      content: '';
      display: block;
      width: 0; height: 0;
      border-style: solid;
      border-width: 7px 0 7px 12px;
      border-color: transparent transparent transparent #fff;
      margin-left: 2px;
    }
    .card:hover .play-icon { background: var(--accent); }

    .card-info { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { 
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 6px; 
      line-height: 1.3; 
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; }
    .tag {
      font-size: 0.65rem;
      background-color: #f1f5f9;
      color: #475569;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* ★ スマホ表示時（画面幅600px以下）の特別な処理 ★ */
    @media (max-width: 600px) {
      body {
        background-image: none;
        background-color: #ffffff; /* スマホ時は背景画像なし・白で塗りつぶし */
      }

      .container {
        width: 100%;
        height: 100vh;
        border-radius: 0;
        border: none;
        box-shadow: none;
        background-color: #ffffff;
        padding: 0 16px 16px 16px;
      }
      
      .sticky-header {
        margin: 0 -16px 16px -16px;
        padding: 16px 12px 10px 12px;
        border-radius: 0;
        
        /* スマホ時：4:1の比率を維持してヘッダー枠へ綺麗に収める */
        background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.55)), var(--header-image);
        background-size: cover;
        background-position: center;
        aspect-ratio: 4 / 1.2;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      header {
        margin-bottom: 8px;
      }
      header h1 {
        font-size: 1.2rem;
        color: #ffffff; /* 白文字に固定 */
        font-weight: 800;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8), 0 0 12px rgba(0, 0, 0, 0.5); /* 強力な文字影 */
      }
      header p {
        color: #f8fafc;
        font-weight: 600;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      }

      .filter-btn {
        padding: 5px 10px;
        font-size: 0.72rem;
        background-color: rgba(255, 255, 255, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .filter-btn.active {
        background-color: #0f172a;
        color: #ffffff;
      }
      .sort-select {
        padding: 4px 8px;
        font-size: 0.72rem;
      }
    }

    /* モーダル */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-content {
      position: relative;
      width: 100%;
      max-width: 900px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    .video-container {
      position: relative;
      padding-top: 56.25%;
      height: 0;
    }
    .video-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: 0;
    }
    .close-btn {
      position: absolute;
      top: -40px; right: 0;
      color: #fff;
      font-size: 28px;
      cursor: pointer;
    }
    .loading { text-align: center; color: var(--text-sub); font-size: 1.1rem; padding: 40px; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <div class="container">
    <!-- ★ ヘッダーとフィルターボタンの固定ブロック ★ -->
    <div class="sticky-header">
      <header>
        <h1>ari's CREATOR PORTFOLIO</h1>
        <p>Music & Video Works</p>
      </header>

      <div class="filter-container" id="filter-container">
        <button class="filter-btn active" data-filter="all">すべて</button>
        <button class="filter-btn" data-filter="作詞">作詞</button>
        <button class="filter-btn" data-filter="作曲">作曲</button>
        <button class="filter-btn" data-filter="MIX">MIX</button>
        <button class="filter-btn" data-filter="歌唱">歌唱</button>
        <button class="filter-btn" data-filter="動画">動画</button>

        <!-- ★ 並べ替えセレクトボックス ★ -->
        <select id="sort-select" class="sort-select">
          <option value="newest">新しい順</option>
          <option value="oldest">古い順</option>
        </select>
      </div>
    </div>

    <!-- 動画一覧のグリッド -->
    <div class="grid" id="portfolio-grid">
      <div class="loading">動画を読み込み中...</div>
    </div>
  </div>

  <!-- 動画再生モーダル -->
  <div class="modal" id="video-modal">
    <div class="modal-content">
      <span class="close-btn" id="modal-close">&times;</span>
      <div class="video-container" id="video-container"></div>
    </div>
  </div>

  <script>
    // ★ 1. ここにご自身のYouTube APIキーを入力してください ★
    const API_KEY = "AIzaSyBflox0J4t8K9ChnspNSDJi5htIIYnydoQ";

    // ★ 2. プレイリストID
    const PLAYLIST_IDS = {
      "作詞": "PLBgx-X3Yb8yZYlQ5P4crH4KCtkkMONvfz",
      "作曲": "PLBgx-X3Yb8yYFEgoWQD3RwJ3x0nAX13x8",
      "MIX":  "PLYIzDOQQK1Tk",
      "歌唱": "PLBgx-X3Yb8ybvcJRmKdcDVnu0lrRYKD_D",
      "動画": "PLSkUQA5PfT3s"
    };

    let allWorksMap = new Map();
    let currentFilter = 'all';

    const grid = document.getElementById('portfolio-grid');
    const modal = document.getElementById('video-modal');
    const videoContainer = document.getElementById('video-container');
    const closeBtn = document.getElementById('modal-close');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const sortSelect = document.getElementById('sort-select');

    // ★ 修正: ページネーション（51個目以降もループして全件取得する処理） ★
    async function fetchPlaylist(tagName, playlistId) {
      if (!playlistId) return;

      let nextPageToken = '';
      
      try {
        do {
          const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${playlistId}&key=${API_KEY}${nextPageToken ? `&pageToken=${nextPageToken}` : ''}`;
          const response = await fetch(url);
          const data = await response.json();

          if (data.items) {
            data.items.forEach(item => {
              const videoId = item.snippet.resourceId.videoId;
              const title = item.snippet.title;
              const thumbnail = item.snippet.thumbnails.high 
                ? item.snippet.thumbnails.high.url 
                : item.snippet.thumbnails.default.url;

              if (allWorksMap.has(videoId)) {
                const existingWork = allWorksMap.get(videoId);
                if (!existingWork.tags.includes(tagName)) {
                  existingWork.tags.push(tagName);
                }
              } else {
                allWorksMap.set(videoId, {
                  id: videoId,
                  title: title,
                  thumbnail: thumbnail,
                  publishedAt: 0, // videos APIで後から正確な投稿日時を代入
                  tags: [tagName]
                });
              }
            });
          }

          nextPageToken = data.nextPageToken || '';
        } while (nextPageToken);

      } catch (error) {
        console.error(`Error fetching ${tagName} playlist:`, error);
      }
    }

    // 動画本体の公開日時（動画投稿日）を取得してデータを更新する関数
    async function fetchVideoDetails() {
      const videoIds = Array.from(allWorksMap.keys());
      if (videoIds.length === 0) return;

      // YouTube APIは一度に最大50件まで指定可能（カンマ区切りで複数チャンク処理）
      const chunks = [];
      for (let i = 0; i < videoIds.length; i += 50) {
        chunks.push(videoIds.slice(i, i + 50));
      }

      for (const chunk of chunks) {
        const idsStr = chunk.join(',');
        const url = `https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${idsStr}&key=${API_KEY}`;
        try {
          const response = await fetch(url);
          const data = await response.json();
          if (data.items) {
            data.items.forEach(item => {
              const videoId = item.id;
              const actualPublishedAt = new Date(item.snippet.publishedAt).getTime();
              if (allWorksMap.has(videoId)) {
                allWorksMap.get(videoId).publishedAt = actualPublishedAt;
              }
            });
          }
        } catch (error) {
          console.error('Error fetching video details:', error);
        }
      }
    }

    async function fetchAllPlaylists() {
      const promises = [];
      for (const [tagName, playlistId] of Object.entries(PLAYLIST_IDS)) {
        if (playlistId) {
          promises.push(fetchPlaylist(tagName, playlistId));
        }
      }

      await Promise.all(promises);
      // 動画自体の投稿日時を正確に取得
      await fetchVideoDetails();
      renderWorks();
    }

    function renderWorks() {
      grid.innerHTML = '';
      let worksArray = Array.from(allWorksMap.values());
      
      // 1. フィルター処理
      let filteredWorks = currentFilter === 'all' 
        ? worksArray 
        : worksArray.filter(w => w.tags.includes(currentFilter));

      // 2. ソート処理（動画自体の投稿日時で比較）
      const sortOrder = sortSelect.value;
      filteredWorks.sort((a, b) => {
        return sortOrder === 'newest' 
          ? b.publishedAt - a.publishedAt 
          : a.publishedAt - b.publishedAt;
      });

      if (filteredWorks.length === 0) {
        grid.innerHTML = '<div class="loading">該当する作品がありません。</div>';
        return;
      }

      filteredWorks.forEach(work => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="thumbnail-wrapper">
            <img src="${work.thumbnail}" alt="${work.title}" loading="lazy">
            <div class="play-icon"></div>
          </div>
          <div class="card-info">
            <div class="card-title">${work.title}</div>
            <div class="card-tags">
              ${work.tags.map(t => `<span class="tag">#${t}</span>`).join('')}
            </div>
          </div>
        `;
        card.addEventListener('click', () => openModal(work.id));
        grid.appendChild(card);
      });
    }

    function openModal(id) {
      videoContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      modal.classList.add('active');
    }

    function closeModal() {
      modal.classList.remove('active');
      videoContainer.innerHTML = '';
    }

    // フィルターボタン切り替え
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderWorks();
      });
    });

    // ソート順切り替えイベント
    sortSelect.addEventListener('change', () => {
      renderWorks();
    });

    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

    fetchAllPlaylists();
  </script>
</body>
</html>
