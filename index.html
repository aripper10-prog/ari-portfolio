<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CREATOR PORTFOLIO</title>
<style>
    :root {
      /* ★ 背景画像のファイル名（GitHubに上げた画像名） */
      --bg-image: url('bg.png'); 

      /* カラー設定（必要に応じて） */
      --text-main: #0f172a;
      --text-sub: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ★ ここを差し替えます！ ★ */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
      
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      
      color: var(--text-main);
      
      /* ウインドウ化（小窓化）のためのレイアウト設定 */
      height: 100vh;
      overflow: hidden; /* 画面全体のスクロールを消し、中央の小窓だけ動かす */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

/* ★ 中央の小窓ウィンドウ ★ */
    .container { 
      width: 90%;                      
      max-width: 760px;               
      height: 85vh;                   
      margin: 0 auto; 
      padding: 0 24px 24px 24px;       /* 上のpaddingは固定ヘッダーで調整 */
      
      background-color: rgba(255, 255, 255, 0.75); 
      backdrop-filter: blur(12px);                 
      border-radius: 16px;                         
      border: 1px solid rgba(255, 255, 255, 0.5);   
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);  
      
      overflow-y: auto;                            /* 中身だけスクロール */
      display: flex;
      flex-direction: column;
    }

    /* ★ ヘッダー＋ボタン全体を最上部に完全固定 ★ */
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      margin: 0 -24px 20px -24px;       /* ウィンドウの左右端まで背景色を伸ばす */
      padding: 20px 24px 12px 24px;
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
      border-radius: 16px 16px 0 0;     /* ウィンドウの上部角丸に合わせる */
    }

    header { 
      text-align: center; 
      margin-bottom: 12px;
    }
    header h1 { 
      font-size: 1.5rem;               
      font-weight: 700;
      letter-spacing: 2.5px; 
      margin-bottom: 4px; 
      color: var(--text-main);
    }
    header p { 
      color: var(--text-sub); 
      font-size: 0.78rem; 
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* フィルターボタン */
    .filter-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    /* ★ スマホ表示時（画面幅600px以下）の特別な処理 ★ */
    @media (max-width: 600px) {
      .container {
        width: 88%;
        padding: 0 16px 16px 16px;
        height: 88vh;
      }
      
      .sticky-header {
        margin: 0 -16px 16px -16px;
        padding: 16px 12px 10px 12px;
        
        /* スマホ時のみ、ヘッダー背景にイラストを表示！ */
        background-image: var(--bg-image);
        background-size: cover;
        background-position: center;
        color: #ffffff; /* イラストの上で見やすいように白文字に */
      }

      /* スマホ時の文字色と影の調整（イラストの上でも読めるように） */
      header h1 {
        font-size: 1.2rem;
        color: #ffffff;
        text-shadow: 0 2px 4px rgba(0,0,0,0.6); /* 薄い黒影をつけて視認性を確保 */
      }
      header p {
        color: rgba(255, 255, 255, 0.9);
        text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      }

      .filter-btn {
        padding: 5px 10px;
        font-size: 0.72rem;
        background-color: rgba(255, 255, 255, 0.9); /* ボタンを読みやすく */
      }
    }
.card {
      background-color: #ffffff;                    /* 白背景にして見やすく */
      border-radius: 8px;                           /* 控えめな角丸 */
      border: 1px solid rgba(226, 232, 240, 0.8);  /* うっすらとした境界線 */
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);    /* ほんのり影をつける */
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }
    
    .card:hover {
      transform: translateY(-3px);                  /* マウスを乗せた時に少し上に浮く */
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }
    .thumbnail-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background-color: #000;
    }
    .thumbnail-wrapper img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .play-icon {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 50px; height: 50px;
      background: rgba(0,0,0,0.7);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play-icon::after {
      content: '';
      display: block;
      width: 0; height: 0;
      border-style: solid;
      border-width: 8px 0 8px 14px;
      border-color: transparent transparent transparent #fff;
      margin-left: 3px;
    }
    .card:hover .play-icon { background: var(--accent); }
    .card:hover .play-icon::after { border-color: transparent transparent transparent #000; }

.card-info { padding: 10px; }
    .card-title { 
      font-size: 0.8rem; /* 少し小さめの文字でスタイリッシュに */
      margin-bottom: 6px; 
      line-height: 1.3; 
    }
    .tag {
      font-size: 0.65rem;
      padding: 2px 6px;
    }
.card-title { 
      font-size: 0.8rem; /* 少し小さめの文字でスタイリッシュに */
      margin-bottom: 6px; 
      line-height: 1.3; 
    }
    .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
.tag {
      font-size: 0.65rem;
      padding: 2px 6px;
    }

    /* モーダル */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-content {
      position: relative;
      width: 100%;
      max-width: 900px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    .video-container {
      position: relative;
      padding-top: 56.25%;
      height: 0;
    }
    .video-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: 0;
    }
    .close-btn {
      position: absolute;
      top: -40px; right: 0;
      color: #fff;
      font-size: 28px;
      cursor: pointer;
    }
    .loading { text-align: center; color: var(--text-sub); font-size: 1.1rem; padding: 40px; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <div class="container">
<!-- ★ ヘッダーとフィルターボタンを1つのブロックにまとめます ★ -->
    <div class="sticky-header">
      <header>
        <h1>ARI'S CREATOR PORTFOLIO</h1>
        <p>Music & Video Works</p>
      </header>

      <div class="filter-container" id="filter-container">
      <button class="filter-btn active" data-filter="all">すべて</button>
      <button class="filter-btn" data-filter="作詞">作詞</button>
      <button class="filter-btn" data-filter="作曲">作曲</button>
      <button class="filter-btn" data-filter="MIX">MIX</button>
      <button class="filter-btn" data-filter="歌唱">歌唱</button>
      <button class="filter-btn" data-filter="動画">動画</button>
    </div>

    <div class="grid" id="portfolio-grid">
      <div class="loading">動画を読み込み中...</div>
    </div>
  </div>

  <div class="modal" id="video-modal">
    <div class="modal-content">
      <span class="close-btn" id="modal-close">&times;</span>
      <div class="video-container" id="video-container"></div>
<div class="grid" id="portfolio-grid">
      <div class="loading">動画を読み込み中...</div>
    </div>
  </div>

  <script>
// ★ 1. APIキー（""で囲む）
    const API_KEY = "AIzaSyBflox0J4t8K9ChnspNSDJi5htIIYnydoQ";

    // ★ 2. プレイリストID（それぞれ""で囲み、末尾にカンマ「,」をつける）
    const PLAYLIST_IDS = {
      "作詞": "PLBgx-X3Yb8yZYlQ5P4crH4KCtkkMONvfz",
      "作曲": "PLBgx-X3Yb8yYFEgoWQD3RwJ3x0nAX13x8",
      "MIX":  "",
      "歌唱": "PLBgx-X3Yb8ybvcJRmKdcDVnu0lrRYKD_D",
      "動画": ""
    };

    let allWorksMap = new Map(); // 動画IDをキーにして重複を防止

    const grid = document.getElementById('portfolio-grid');
    const modal = document.getElementById('video-modal');
    const videoContainer = document.getElementById('video-container');
    const closeBtn = document.getElementById('modal-close');
    const filterBtns = document.querySelectorAll('.filter-btn');

    // 指定されたプレイリストから動画を取得する関数
    async function fetchPlaylist(tagName, playlistId) {
      if (!playlistId) return;

      const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${playlistId}&key=${API_KEY}`;
      
      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.items) {
          data.items.forEach(item => {
            const videoId = item.snippet.resourceId.videoId;
            const title = item.snippet.title;
            const thumbnail = item.snippet.thumbnails.high 
              ? item.snippet.thumbnails.high.url 
              : item.snippet.thumbnails.default.url;

            // すでに別のプレイリスト経由で登録済みの場合はタグ（役割）を追加
            if (allWorksMap.has(videoId)) {
              const existingWork = allWorksMap.get(videoId);
              if (!existingWork.tags.includes(tagName)) {
                existingWork.tags.push(tagName);
              }
            } else {
              // 新規追加
              allWorksMap.set(videoId, {
                id: videoId,
                title: title,
                thumbnail: thumbnail,
                tags: [tagName]
              });
            }
          });
        }
      } catch (error) {
        console.error(`Error fetching ${tagName} playlist:`, error);
      }
    }

    // すべてのプレイリストを一括読み込み
    async function fetchAllPlaylists() {
      const promises = [];
      for (const [tagName, playlistId] of Object.entries(PLAYLIST_IDS)) {
        if (playlistId && playlistId !== "PLxxxxxxxxxxxx1") {
          promises.push(fetchPlaylist(tagName, playlistId));
        }
      }

      await Promise.all(promises);
      renderWorks();
    }

    function renderWorks(filter = 'all') {
      grid.innerHTML = '';
      const worksArray = Array.from(allWorksMap.values());
      
      const filteredWorks = filter === 'all' 
        ? worksArray 
        : worksArray.filter(w => w.tags.includes(filter));

      if (filteredWorks.length === 0) {
        grid.innerHTML = '<div class="loading">該当する作品がありません。</div>';
        return;
      }

      filteredWorks.forEach(work => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="thumbnail-wrapper">
            <img src="${work.thumbnail}" alt="${work.title}" loading="lazy">
            <div class="play-icon"></div>
          </div>
          <div class="card-info">
            <div class="card-title">${work.title}</div>
            <div class="card-tags">
              ${work.tags.map(t => `<span class="tag">#${t}</span>`).join('')}
            </div>
          </div>
        `;
        card.addEventListener('click', () => openModal(work.id));
        grid.appendChild(card);
      });
    }

    function openModal(id) {
      videoContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      modal.classList.add('active');
    }

    function closeModal() {
      modal.classList.remove('active');
      videoContainer.innerHTML = '';
    }

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderWorks(btn.dataset.filter);
      });
    });

    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

    // 読み込み実行
    fetchAllPlaylists();
  </script>
</body>
</html>
